name: Probe production OpenReview webhook auth

on:
  push:
    branches:
      - refactor/minimal-deepseek-byok

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production webhook initialization
        run: |
          set +e
          status="$(curl --silent --show-error             --output /tmp/body.txt             --write-out '%{http_code}'             --request POST             --url 'https://openreview-selfhost.vercel.app/api/webhooks'             --header 'Content-Type: application/json'             --header 'User-Agent: openreview-auth-probe'             --data '{}')"
          rc=$?
          set -e
          echo "curl_exit=$rc"
          echo "http_status=$status"
          echo "body_prefix=$(head -c 500 /tmp/body.txt | tr '\n' ' ')"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
