name: OpenReview mention

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@openreview') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Request OpenReview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          INSTRUCTIONS: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({
              "repository": os.environ["REPOSITORY"],
              "prNumber": int(os.environ["PR_NUMBER"]),
              "instructions": os.environ["INSTRUCTIONS"],
          }).encode()

          request = urllib.request.Request(
              "https://openreview-selfhost.vercel.app/api/action-review",
              data=payload,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "openreview-github-action",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=540) as response:
              result = json.load(response)
              print(json.dumps({
                  "ok": result.get("ok"),
                  "reviewUrl": result.get("reviewUrl"),
              }))
          PY
